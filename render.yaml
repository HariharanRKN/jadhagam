# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect private GitHub repo → New Blueprint → select render.yaml

services:
  - type: web
    name: kundli
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: kundli-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=192
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: KUNDALI_DB_PATH
        value: /var/data/saved_kundalis.sqlite
