# Render Blueprint: https://render.com/docs/blueprint-spec
# Connect private GitHub repo → New Blueprint → select render.yaml
#
# Free instances sleep and lose local files. Saved kundalis persist only if you
# set KUNDALI_DB_URL and KUNDALI_DB_AUTH_TOKEN (Turso) in the Render dashboard.

services:
  - type: web
    name: kundli
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=192
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: KUNDALI_DB_URL
        sync: false
      - key: KUNDALI_DB_AUTH_TOKEN
        sync: false
